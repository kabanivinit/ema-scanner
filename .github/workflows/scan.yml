name: "1 - EMA Scan (every 15 minutes)"

on:
  schedule:
    # GitHub's own timer, as often as GitHub allows (every 5 minutes, starting at :03). A run only does real work when a
    # new candle has closed, so the extra runs are free. It is the safety net: for punctual alerts also set up the outside
    # timer described in the guide (section "Punctual alerts") - GitHub's timer is often late.
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: show alerts in this log instead of sending them to Telegram"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ema-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45          # a slow Indian round on Fyers' free plan alone can take ~18 minutes
    steps:
      - uses: actions/checkout@v4

      # Only does something if you uploaded ema-scanner.zip to the repository instead of the folders.
      - name: Unpack the scanner (needed only if you uploaded the .zip file)
        run: |
          python3 - <<'PY'
          import glob, os, zipfile
          for z in sorted(glob.glob("*.zip")):
              with zipfile.ZipFile(z) as f:
                  names = f.namelist()
                  marker = next((n for n in names if n.endswith("scanner/__main__.py")), None)
                  if marker is None:
                      continue
                  prefix = marker[: -len("scanner/__main__.py")]
                  for name in names:
                      rel = name[len(prefix):]
                      if not name.startswith(prefix) or not rel or rel.endswith("/") or ".." in rel.split("/"):
                          continue
                      if rel.startswith(".github/") or (rel == "config.yaml" and os.path.exists(rel)):
                          continue          # workflows stay as you pasted them; your own settings file always wins
                      os.makedirs(os.path.dirname(rel) or ".", exist_ok=True)
                      with open(rel, "wb") as out:
                          out.write(f.read(name))
              print("Unpacked", z)
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tools
        run: pip install -r requirements.txt

      - name: Restore the memory of alerts already sent
        uses: actions/cache/restore@v4
        with:
          path: |
            state
            universe_cache
          key: ema-state-${{ github.run_id }}
          restore-keys: |
            ema-state-

      - name: Scan and send Telegram alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FYERS_APP_ID: ${{ secrets.FYERS_APP_ID }}
          FYERS_SECRET_ID: ${{ secrets.FYERS_SECRET_ID }}
          FYERS_PIN: ${{ secrets.FYERS_PIN }}
          FYERS_REDIRECT_URI: ${{ secrets.FYERS_REDIRECT_URI }}
          FYERS_PLAN: ${{ secrets.FYERS_PLAN }}
        run: python -m scanner scan ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Save the memory of alerts already sent
        if: ${{ always() && inputs.dry_run != true }}
        uses: actions/cache/save@v4
        with:
          path: |
            state
            universe_cache
          key: ema-state-${{ github.run_id }}-${{ github.run_attempt }}
