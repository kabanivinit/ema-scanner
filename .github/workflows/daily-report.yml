name: "2 - Daily Report"

on:
  schedule:
    # 11:40 UTC = 17:10 IST, after the Indian market close
    - cron: "40 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ema-scanner
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Only does something if you uploaded ema-scanner.zip to the repository instead of the folders.
      - name: Unpack the scanner (needed only if you uploaded the .zip file)
        run: |
          python3 - <<'PY'
          import glob, os, zipfile
          for z in sorted(glob.glob("*.zip")):
              with zipfile.ZipFile(z) as f:
                  names = f.namelist()
                  marker = next((n for n in names if n.endswith("scanner/__main__.py")), None)
                  if marker is None:
                      continue
                  prefix = marker[: -len("scanner/__main__.py")]
                  for name in names:
                      rel = name[len(prefix):]
                      if not name.startswith(prefix) or not rel or rel.endswith("/") or ".." in rel.split("/"):
                          continue
                      if rel.startswith(".github/") or (rel == "config.yaml" and os.path.exists(rel)):
                          continue          # workflows stay as you pasted them; your own settings file always wins
                      os.makedirs(os.path.dirname(rel) or ".", exist_ok=True)
                      with open(rel, "wb") as out:
                          out.write(f.read(name))
              print("Unpacked", z)
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tools
        run: pip install -r requirements.txt

      - name: Restore the memory of alerts already sent
        uses: actions/cache/restore@v4
        with:
          path: |
            state
            universe_cache
          key: ema-state-${{ github.run_id }}
          restore-keys: |
            ema-state-

      - name: Build the report and send it to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FYERS_APP_ID: ${{ secrets.FYERS_APP_ID }}
          FYERS_SECRET_ID: ${{ secrets.FYERS_SECRET_ID }}
          FYERS_PIN: ${{ secrets.FYERS_PIN }}
          FYERS_REDIRECT_URI: ${{ secrets.FYERS_REDIRECT_URI }}
          FYERS_PLAN: ${{ secrets.FYERS_PLAN }}
        run: python -m scanner report

      # The report itself goes to your private Telegram chat only. It is not saved in this PUBLIC repository, because
      # it contains figures built from Fyers / TradingView prices that are meant for your personal use. Only the
      # symbol lists (public index membership) are kept here.
      - name: Keep the symbol lists in the repository
        if: ${{ always() }}
        run: |
          git config user.name "ema-scanner-bot"
          git config user.email "ema-scanner-bot@users.noreply.github.com"
          # "git checkout -- ." drops the other changes this run made to tracked files (the report files of earlier days,
          # which the run rewrites): git refuses to pull while they are lying around. The symbol lists are already inside
          # the commit, and today's report is deliberately not saved here.
          save() {
            git add universe_cache 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "Nothing new to save."
              return 0
            fi
            git commit -m "Symbol lists $(date -u +%F)" &&
            git checkout -- . &&
            git pull --rebase &&
            git push
          }
          if ! save; then
            echo "::warning::Could not save the symbol lists in the repository this time. The report was still sent to Telegram and nothing is lost: the scanner keeps its own copy of the lists."
          fi

      - name: Save the memory of alerts already sent
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: |
            state
            universe_cache
          key: ema-state-${{ github.run_id }}-${{ github.run_attempt }}
