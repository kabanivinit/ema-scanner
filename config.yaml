# =====================================================================
#  EMA CROSSOVER SCANNER - SETTINGS
#  You can edit this file directly on GitHub (click the pencil icon).
#  Lines starting with # are notes and are ignored.
#  Keep the spaces at the start of lines exactly as they are.
# =====================================================================

# WHERE THE PRICES COME FROM
#   auto         = TradingView first, Yahoo Finance as the automatic backup   (recommended)
#   tradingview  = TradingView only
#   yahoo        = Yahoo Finance only (commodities then use global futures instead of MCX)
# TradingView's free feed is unofficial and DELAYED about 15 minutes for NSE / US / MCX (crypto is live),
# so alerts for those markets arrive roughly 15-20 minutes after a candle closes.
data_source: auto

ema:
  short: 10            # GREEN line
  long: 20             # RED line

# Timeframes to watch. Delete a line to switch that timeframe off.
timeframes: ["15m", "1h", "4h", "1d", "1w"]

alerts:
  directions: both            # both | bullish | bearish
  tradingview_links: true     # symbol names become clickable links to TradingView
  max_lines_per_message: 40   # long lists are split into several Telegram messages
  min_data_coverage: 0.80     # if the data feed returns fewer than 80% of symbols, the run is retried later

# Times in alerts and reports are shown in this time zone
display_timezone: "Asia/Kolkata"

# ---------------------------------------------------------------------
# WHAT TO SCAN.   enabled: false  switches a whole group off.
# Add   timeframes: ["1h", "1d"]   under a group to scan only those for it.
# ---------------------------------------------------------------------
universes:
  nifty500:
    enabled: true
    label: "Nifty 500"
    market: NSE
    currency: "₹"
    source: nse_nifty500          # list is downloaded from NSE automatically

  nasdaq100:
    enabled: true
    label: "Nasdaq 100"
    market: US
    currency: "$"
    source: wiki_nasdaq100        # list is downloaded automatically

  crypto:
    enabled: true
    label: "Crypto"
    market: CRYPTO
    currency: "$"
    source: list
    list: crypto

  commodities:
    enabled: true
    label: "Commodities (MCX)"
    market: MCX
    currency: "₹"
    source: list
    list: mcx
    sources: [auto, tradingview]  # MCX prices exist on TradingView only

  commodities_global:
    enabled: true
    label: "Commodities (global proxy for MCX)"
    market: FUT
    currency: "$"
    source: list
    list: commodities_global
    sources: [yahoo]              # used only when data_source is yahoo

  sp500:
    enabled: true
    label: "S&P 500"
    market: US
    currency: "$"
    source: wiki_sp500            # list is downloaded automatically

  indian_indices:
    enabled: true
    label: "Indian Indices"
    market: NSE
    currency: ""
    source: list
    list: indian_indices

# ---------------------------------------------------------------------
# LISTS.  To add a symbol, copy one line and change symbol / name / tv.
#   symbol   = our ID. For most lines it is the Yahoo Finance code (used for the Yahoo backup).
#   tv       = the TradingView code (open the chart on tradingview.com and copy EXCHANGE:SYMBOL)
#   base     = crypto only: the coin ticker if it differs from the symbol (e.g. UNI)
#   optional = true -> never counted against data coverage (use when you are not sure the code exists)
# Run "0 - Check Setup" after editing: it lists every code TradingView does not recognise.
# ---------------------------------------------------------------------
lists:
