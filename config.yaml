# ---------------------------------------------------------------------
# ADVANCED (leave as is unless you know why)
# ---------------------------------------------------------------------
min_bars: 60                       # candles needed before a symbol is evaluated
scan_last_bars: {15m: 3, 1h: 2, 4h: 2, 1d: 2, 1w: 2}      # catches crossovers if a run was late
settle_minutes: {15m: 1, 1h: 2, 4h: 2, 1d: 15, 1w: 15}    # wait after a candle closes
max_alert_age_minutes: {15m: 180, 1h: 600, 4h: 1500, 1d: 4320, 1w: 14400}  # never alert on older candles

# How late each free data feed is. The scanner waits this long after a candle closes, so it never judges a
# candle that is still being built inside the delayed feed. "0 - Check Setup" prints what TradingView reports.
feed_delay_minutes:
  tradingview: {NSE: 15, US: 15, MCX: 15, FUT: 15, CRYPTO: 0}
  yahoo:       {NSE: 0,  US: 0,  MCX: 0,  FUT: 0,  CRYPTO: 0}

tradingview:
  batch_size: 25                   # symbols per connection
  pause_seconds: 0.4               # rest between batches (be gentle with TradingView)
  max_seconds: 900                 # TradingView may use at most this long in one run
yahoo:
  batch_size: 50
  pause_seconds: 2.0
  threads: 4
  retries: 2
  max_seconds: 900
